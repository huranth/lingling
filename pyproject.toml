[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingling"
version = "2.0.0"
description = "Official OpenCode, but your requests ride rotating Tor exit lanes."
requires-python = ">=3.11"
dependencies = ["stem==1.8.2"]

[project.scripts]
lingling = "lingling.cli:entry"

[tool.setuptools]
packages = ["lingling"]
